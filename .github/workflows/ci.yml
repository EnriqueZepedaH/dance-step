name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Build needs the env validator to pass. CI-only stub values keep
      # the format checks happy without leaking any real secrets — the
      # build artifact from CI is never deployed (Vercel builds its own).
      - name: Build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_stub
          CLERK_SECRET_KEY: sk_test_ci_stub
          CLERK_WEBHOOK_SECRET: whsec_ci_stub
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_stub
          SUPABASE_SERVICE_ROLE_KEY: ci_stub_service_role
        run: npm run build
